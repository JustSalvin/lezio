# lezio theme - the house visual style of the videos.
# Copy this file to themes/<name>.toml to make your own, then choose it in config.toml ([video] theme)
# or with ./lezio config. Preview a theme: ./lezio themes --preview <name>
# Scene code uses the color NAMES (PRIMARY, HIGHLIGHT, ...), so every lesson follows the active theme.

name = "Light"
description = "white background, blue and orange accents, clean sans-serif"

[colors]
background = "#FFFFFF"
text = "#1E1E1E"            # body text
muted = "#6B6B6B"           # secondary text, labels, axes
primary = "#1446A0"         # titles and the main elements
primary_soft = "#E3ECFA"    # fills behind primary elements
secondary = "#E8590C"       # a second, contrasting family of elements
secondary_soft = "#FDEBDD"
highlight = "#F2B705"       # what the voice is talking about right now
highlight_soft = "#FFF6D6"
positive = "#2E9E44"        # correct, yes, gain
positive_soft = "#E3F5E7"
negative = "#D32F2F"        # wrong, no, loss
negative_soft = "#FDE2E2"
neutral_soft = "#F2F2F2"    # neutral fills (cards, table rows)

[fonts]
text = "Avenir Next"        # body text
title = "Avenir Next"       # headings
mono = "Menlo"              # code, binary strings, numbers in columns
hand = "Chalkboard SE"      # handwriting, for board-like writing and annotations

[sizes]
title = 48
text = 34
small = 26
