# slide-reader configuration: your stable preferences.
#
# Precedence (lowest -> highest):
#   built-in defaults < this file < settings saved in each lesson (scripts/<lesson>.json) < command-line options
# Per-video choices (pages, visual mode, depth) are asked by the wizard or given as options; the values
# below are only their defaults.

[tts]
# Text-to-speech engine. See every engine, its options and voices with:  ./sr tts
#   voxtral = local on Apple Silicon (default)      edge = Microsoft voices, online, free
engine = "voxtral"

[tts.voxtral]
model = "mlx-community/Voxtral-4B-TTS-2603-mlx-6bit"
voice = "it_male"
temperature = 0.8

[tts.edge]
voice = "it-IT-DiegoNeural"
rate = "+0%"
pitch = "+0Hz"

[narration]
# Language of the narration and of the on-screen animation texts
language = "Italian"
# Default visual mode:  slides | mixed | animated
visual = "mixed"
# Default depth:  1 extensive | 2 faithful | 3 condensed | 4 short
depth = 2
# Seconds of silence between two spoken pieces
beat_gap = 0.35

[agent]
# The program calls an LLM for the tasks that need judgment (planning, writing, judging frames).
# The model works only through tools defined by the program (no files, no shell).
#   "claude-subscription" = Claude via the Claude Agent SDK, using your Claude Code login (subscription)
#   "anthropic-api"       = Anthropic API key (planned, not implemented yet)
backend = "claude-subscription"
# Model for the agent ("" = Claude Code default)
model = ""
# Instructions given to the agent in every lesson (a lesson can add its own with --instructions).
# Example: "Skip interactive slides such as live polls or quizzes. Do not read URLs aloud."
instructions = ""
# Slides written per agent task (smaller = more focused tasks, more calls)
group_size = 4
# Rounds of "render animations -> agent judges the frames -> fix" per group of slides
animation_rounds = 2
# Seconds per narration step when animations are previewed before the audio exists
placeholder_seconds = 5
# After the final render the agent judges the frames of the re-rendered slides and fixes real defects
review = true
# Slides per review task
review_group_size = 5

[video]
width = 1920
height = 1080
fps = 30
# Slides rendered in parallel
parallel_jobs = 4
# Pixel width of the slide images embedded in the video (higher = sharper slow zoom)
slide_image_width = 2700
# Pixel width of the slide previews the agent looks at
preview_image_width = 1280
# Height of the lightweight copy of the final video
small_height = 720
