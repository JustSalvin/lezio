# slide-reader configuration.
#
# Only stable configuration lives here. Choices made for each video (pages, visual mode, depth,
# instructions for the agent) are given to the program - wizard or command-line options - and saved
# in the lesson.

[tts]
# Text-to-speech engine. Engines, options and voices: ./sr tts   Try a voice: ./sr tts --try "..."
#   voxtral = local on Apple Silicon      edge = Microsoft voices, online, free
# Changing the voice also changes existing lessons the next time they are rebuilt.
engine = "voxtral"

[tts.voxtral]
model = "mlx-community/Voxtral-4B-TTS-2603-mlx-6bit"
voice = "it_male"
temperature = 0.8

[tts.edge]
voice = "it-IT-DiegoNeural"
rate = "+0%"
pitch = "+0Hz"

[narration]
# Language of the narration and of the on-screen animation texts (should match the voice)
language = "Italian"
# Seconds of silence between two spoken pieces
beat_gap = 0.35

[agent]
# The LLM used for the tasks that need judgment (planning, writing, judging frames).
# The model works only through tools defined by the program (no files, no shell).
#   "claude-subscription" = Claude via the Claude Agent SDK, using your Claude Code login (subscription)
#   "anthropic-api"       = Anthropic API key (planned, not implemented yet)
backend = "claude-subscription"
# Model: an alias (opus, sonnet, haiku) or a full id (e.g. claude-opus-5-5, claude-sonnet-5-5)
model = "opus"
# Reasoning effort: low | medium | high | xhigh | max
effort = "high"

# Optional per-task overrides (plan = classify the slides, write = the narration, review = final check).
# [agent.review]
# model = "sonnet"
# effort = "medium"

[video]
width = 1920
height = 1080
fps = 30

# ---------------------------------------------------------------------------------------------
# Tuning: you normally do not need to change these.

[tuning]
# Slides written per agent task (smaller = more focused tasks, more calls)
group_size = 4
# How many times the agent may preview its animations while writing a group of slides
animation_rounds = 2
# Seconds per narration step when animations are previewed before the voice exists
placeholder_seconds = 5
# Slides per final-review task
review_group_size = 5
# Slides rendered in parallel
parallel_jobs = 4
# Pixel width of the slide images in the video (higher = sharper slow zoom)
slide_image_width = 2700
# Pixel width of the slide pictures shown to the agent
preview_image_width = 1280
