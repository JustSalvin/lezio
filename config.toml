# lezio configuration.
#
# Only stable configuration lives here. Choices made for each video (study material, style, depth,
# instructions for the agent) are given to the program - wizard or command-line options - and
# saved in the lesson. Edit this file by hand or interactively with: ./lezio config

[tts]
# Text-to-speech engine. Engines, options and voices: ./lezio tts   Try a voice: ./lezio tts --try "..."
#   voxtral = local on Apple Silicon      edge = Microsoft voices, online, free
# Changing a voice also changes existing lessons the next time they are rebuilt.
engine = "voxtral"

[tts.voxtral]
model = "mlx-community/Voxtral-4B-TTS-2603-mlx-6bit"
voice = "it_male"
temperature = 0.8

[tts.edge]
voice = "it-IT-DiegoNeural"
rate = "+0%"
pitch = "+0Hz"

[narration]
# Language of the narration and of the on-screen texts (should match the voice)
language = "Italian"
# Seconds of silence between two spoken pieces
piece_gap = 0.35

[agent]
# The LLM used for the tasks that need judgment (planning the lesson, writing narration and scenes,
# judging the final frames). The model works only through tools defined by the program.
#   "claude-subscription" = Claude via the Claude Agent SDK, using your Claude Code login (subscription)
#   "anthropic-api"       = Anthropic API key (planned, not implemented yet)
backend = "claude-subscription"
# Model: an alias (opus, sonnet, haiku) or a full id (e.g. claude-opus-5-5, claude-sonnet-5-5)
model = "sonnet"
# Reasoning effort: low | medium | high | xhigh | max
effort = "high"

# Optional per-task overrides (plan = outline and segments, write = narration and scenes,
# review = final check of the rendered video).
# [agent.review]
# model = "sonnet"
# effort = "medium"

[video]
# House visual style: a theme file in themes/ (light, dark, chalkboard, whiteboard, paper, or your own).
# Preview: ./lezio themes --preview <name>. A lesson can ask for another one in its instructions.
theme = "light"
width = 1920
height = 1080
fps = 30

# ---------------------------------------------------------------------------------------------
# Tuning: you normally do not need to change these.

[tuning]
# Segments written per agent task (smaller = more focused tasks, more calls)
segments_per_task = 2
# How many times the agent may submit (and preview) each segment while writing it
preview_rounds = 4
# A scene render taking longer than this is stopped (seconds)
render_timeout_seconds = 600
# Segments per final-review task
review_group_size = 4
# Segments rendered in parallel
parallel_jobs = 4
# Pixel width of the page images used in the video (higher = sharper zooms)
page_image_width = 2700
# Pixel width of the pictures shown to the agent
preview_image_width = 1280
