# lezio configuration.
#
# Only stable configuration lives here. Choices made for each video (study material, style, depth,
# instructions for the agent) are given to the program - wizard or command-line options - and
# saved in the lesson. Edit this file by hand or interactively with: ./lezio config

[tts]
# Text-to-speech engine. Engines, options and voices: ./lezio tts   Try a voice: ./lezio tts --try "..."
#   voxtral = local on Apple Silicon      edge = Microsoft voices, online, free
# Changing a voice also changes existing lessons the next time they are rebuilt.
engine = "voxtral"

[tts.voxtral]
model = "mlx-community/Voxtral-4B-TTS-2603-mlx-6bit"
voice = "it_male"
temperature = 0.8

[tts.edge]
voice = "it-IT-DiegoNeural"
rate = "+0%"
pitch = "+0Hz"

[narration]
# Language of the narration and of the on-screen texts (should match the voice)
language = "Italian"
# Seconds of silence between two spoken pieces
piece_gap = 0.35

[agent]
# The LLM used for the tasks that need judgment (planning the lesson, writing narration and scenes,
# judging the final frames). The model works only through tools defined by the program.
#   "claude-subscription" = Claude with your Claude Code login (subscription, no API key)
#   "anthropic-api"       = Claude with an Anthropic API key (ANTHROPIC_API_KEY), paid per token
#   "openai-api"          = OpenAI models with an OpenAI API key (OPENAI_API_KEY), paid per token
#   "local"               = a model on this computer (Ollama, LM Studio, llama.cpp...): free, but small
#                           models write weaker lessons and are slower
# Each backend keeps its settings in its own table below: switching is this one line.
backend = "claude-subscription"
# In every table: model, and reasoning effort (low | medium | high | xhigh | max).
# Per-task overrides (plan = outline and segments, write = narration and scenes, review = final check of
# the rendered video) go in a table under the backend, e.g.
#   [agent.claude-subscription.plan]
#   model = "opus"

[agent.claude-subscription]
# An alias (opus, sonnet, haiku) or a full id (e.g. claude-opus-5-5, claude-sonnet-5-5)
model = "sonnet"
effort = "high"

[agent.anthropic-api]
# An alias (opus, sonnet, haiku, fable) or a full id (e.g. claude-opus-5-5, claude-sonnet-5-5)
model = "sonnet"
effort = "high"

[agent.openai-api]
# gpt-6.1-sol (balanced), gpt-6-astra (the most capable), gpt-6-luna (the fastest), or another model id
model = "gpt-6.1-sol"
effort = "high"

[agent.local]
# Address of an OpenAI-compatible server: Ollama http://localhost:11434/v1 · LM Studio http://localhost:1234/v1
url = "http://localhost:11434/v1"
# A model with tool calling and, if possible, vision (it looks at pages and frames), named as on the server.
# Ollama: `ollama pull gemma4:12b` (gemma4:26b is better if memory allows). The server must run it with a
# context of 32768 tokens or more (Ollama: the app's settings, or OLLAMA_CONTEXT_LENGTH=32768 ollama serve).
model = "gemma4:12b"
# Sent only if set, for models that reason ("" = not sent)
effort = ""
# false if the model cannot see images: it then gets a note instead of the pictures
vision = true

[video]
# House visual style: a theme file in themes/ (light, dark, chalkboard, whiteboard, paper, or your own).
# Preview: ./lezio themes --preview <name>. A lesson can ask for another one in its instructions.
theme = "dark"
# Subtitles from the narration:
#   "track"  = a track inside the MP4 that players turn on and off, plus output/<lesson>.srt
#   "burned" = always visible, drawn into the picture      "off" = none
subtitles = "track"
width = 1920
height = 1080
fps = 30

# ---------------------------------------------------------------------------------------------
# Tuning: you normally do not need to change these.

[tuning]
# Segments written per agent task (smaller = more focused tasks, more calls)
segments_per_task = 2
# Generate the voice of the segments already written while the agent writes the next ones
voice_while_writing = true
# How many times the agent may submit (and preview) each segment while writing it
preview_rounds = 4
# A scene render taking longer than this is stopped (seconds)
render_timeout_seconds = 600
# Segments per final-review task
review_group_size = 4
# Segments rendered in parallel
parallel_jobs = 4
# Pixel width of the page images used in the video (higher = sharper zooms)
page_image_width = 2700
# Pixel width of the pictures shown to the agent
preview_image_width = 1280
