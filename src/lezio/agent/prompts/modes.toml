# How each per-video choice is explained to the model.

[visual]
slides = "Only the original slides are shown. NO anim beats. Highlight almost every beat; use image for figures and zoom for picture slides."
mixed = "The slides are shown with highlights; add full-screen anim beats where seeing explains better than reading, then go back to the slide."
animated = "The slides are NEVER shown: EVERY beat is an anim. Rebuild each slide's content with templates (title_card, bullets, diagram, flow, ...) and custom animations."

[depth]
1 = "EXTENSIVE: say everything on the slide, then go deeper: explain each term, give a concrete example or analogy, connect to earlier/later slides, ask rhetorical questions. Never summarize. About 1-3 min per content slide."
2 = "FAITHFUL: say everything on the slide, rephrased naturally for speech. Clarify only what would be unclear when heard. No extra examples. Never summarize. About 0.5-1.5 min per content slide."
3 = "CONDENSED: the main points of each slide, lightly summarized; merge minor details; drop repetitions. About 20-45 s per slide."
4 = "SHORT: short-video style, the key idea only, punchy sentences, a hook at the start and a one-line takeaway at the end. About 5-15 s per slide."
